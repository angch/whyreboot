name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: never cut a release from an unformatted tree. Cheap and fails fast,
  # so the three build jobs below don't burn minutes on a tree that must be
  # re-tagged anyway. Mirrors the `fmt` job in ci.yml.
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  build-macos:
    runs-on: macos-latest
    needs: fmt

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --release

      - name: Build release binaries (both architectures)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create -output whyreboot-cli-macos-universal \
            target/aarch64-apple-darwin/release/whyreboot \
            target/x86_64-apple-darwin/release/whyreboot
          file whyreboot-cli-macos-universal

      # Smoke test: scan the runner's own unified log for the last hour.
      - name: Smoke test on live unified log
        run: |
          ./whyreboot-cli-macos-universal --help
          ./whyreboot-cli-macos-universal --since "1 hour ago" --no-color || true

      - name: Show binary size
        run: ls -la whyreboot-cli-macos-universal

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: whyreboot-cli-macos-universal
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    # Serialized so the release-upload steps never race to create the tag's release.
    needs: build-macos

    steps:
      - uses: actions/checkout@v4

      # No musl-tools/C cross-toolchain needed: the crate has no C dependencies
      # and rust-std ships a prebuilt musl libc, so the target alone suffices.
      # Stable runs the tests and is the fallback if the nightly build below
      # breaks; the shipped binary is normally built by nightly.
      - name: Install Rust stable (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # `-Zbuild-std` is nightly-only. It rebuilds std without its `backtrace`
      # feature, which halves the shipped artifact (216 KB -> 125 KB compressed).
      # That machinery is dead weight here: the release profile sets
      # `strip = true`, so every frame it prints is `<unknown>` — dropping it
      # keeps the panic message and file:line and loses only hex addresses.
      # See "Binary size" in AGENTS.md. Revert to a plain stable build once
      # build-std stabilizes.
      - name: Install Rust nightly (build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Distinct from the other jobs' key: this target dir holds a
          # from-source std, which must not be shared with a stable build.
          key: ${{ runner.os }}-cargo-buildstd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-buildstd-

      # Tests run on stable: they exercise this crate's logic, which the nightly
      # std swap doesn't change, and building std from source for the test
      # profile as well would only cost minutes.
      - name: Run tests
        run: cargo +stable test --release --target x86_64-unknown-linux-musl

      # default-members = ["."] keeps the Windows-only GUI out of this build.
      # `-C relocation-model=static` comes from .cargo/config.toml — deliberately
      # not passed as RUSTFLAGS here, which would override that config.
      - name: Build release binary (nightly, std without backtrace)
        id: build_min
        continue-on-error: true
        run: |
          cargo +nightly build --release --target x86_64-unknown-linux-musl \
            -Zbuild-std=std,panic_abort -Zbuild-std-features=

      # A nightly regression must not block a release. If build-std fails, fall
      # back to the stable build: same binary, ~90 KB larger compressed.
      - name: Fall back to stable build
        if: steps.build_min.outcome == 'failure'
        run: |
          echo "::warning::nightly -Zbuild-std failed; falling back to the stable build (larger binary)"
          cargo +stable build --release --target x86_64-unknown-linux-musl

      - name: Verify fully static
        run: |
          file target/x86_64-unknown-linux-musl/release/whyreboot
          ldd  target/x86_64-unknown-linux-musl/release/whyreboot 2>&1 | grep -qE 'not a dynamic|statically linked'

      - name: Compress with UPX
        run: |
          sudo apt-get update -q && sudo apt-get install -qy upx-ucl
          upx --best --lzma target/x86_64-unknown-linux-musl/release/whyreboot

      # Exercise the artifact that actually ships, not just `--help`: replay a
      # fixture and require the documented exit code. This is what would catch a
      # from-source std that built but misbehaves at runtime.
      - name: Smoke test compressed binary
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/whyreboot
          $BIN --help
          $BIN --from-file tests/fixtures/oom.jsonl --all --no-color
          set +e; $BIN --from-file tests/fixtures/oom.jsonl --all --exit-code >/dev/null; rc=$?; set -e
          test "$rc" -eq 10 || { echo "expected exit 10 for critical findings, got $rc"; exit 1; }

      - name: Rename artifact
        run: cp target/x86_64-unknown-linux-musl/release/whyreboot whyreboot-cli-x86_64-linux

      - name: Show binary size
        run: ls -la whyreboot-cli-x86_64-linux

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: whyreboot-cli-x86_64-linux
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: windows-latest
    # Serialized after the Linux job so the two release-upload steps never race
    # to create the same tag's release (action-gh-release updates if it exists).
    needs: build-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Compress with UPX
        shell: pwsh
        run: |
          choco install upx --yes --no-progress
          upx --best --lzma target\release\whyreboot.exe
          upx --best --lzma target\release\whyreboot-gui.exe

      - name: Rename artifacts
        shell: pwsh
        run: |
          Copy-Item target\release\whyreboot.exe     whyreboot-cli-x86_64-windows.exe
          Copy-Item target\release\whyreboot-gui.exe whyreboot-gui-x86_64-windows.exe

      - name: Show binary sizes
        shell: pwsh
        run: |
          Get-Item whyreboot-cli-x86_64-windows.exe, whyreboot-gui-x86_64-windows.exe |
            Select-Object Name, @{N='KB';E={[math]::Round($_.Length/1KB,1)}}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            whyreboot-cli-x86_64-windows.exe
            whyreboot-gui-x86_64-windows.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
