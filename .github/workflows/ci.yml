name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # cargo fmt walks the whole workspace, including the Windows-only `gui`
      # crate that default-members excludes from build/test — so this checks
      # every source file even though it runs on Linux.
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: build + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-targets
